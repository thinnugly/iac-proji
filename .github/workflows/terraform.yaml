name: Terraform CI/CD

on:
    workflow_dispatch: # Allows manual trigging for the workflow
        inputs:
            apply:
                description: 'Executar terraform apply?'
                required: true
                default: 'false'
                type: choice
                options:
                    - 'true'
                    - 'false'
permissions:
  id-token: write
  contents: read
jobs:
    job1:
        name: Terraform CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform/environments/prod
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.1.0
              with:
                role-to-assume: arn:aws:iam::340705986117:role/GitHubRunnerTerraformRole
                aws-region: us-east-1

            - name: HashiCorp - Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.0

            - name: Terraform Init
              run: terraform init -backend-config=../../global/backend/backend.hcl

            - name: Terraform Validate
              run: terraform validate
            
            - name: Terrafrom Plan
              run: terraform plan -out=tfplan.tfout

            - name: Terraform Apply
              run: terraform apply -auto-approve tfplan.tfout
              if: github.event.inputs.apply == 'true'
              