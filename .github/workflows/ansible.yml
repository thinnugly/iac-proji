name: Ansible CI/CD

on:
  workflow_run:
    workflows: ["Terraform CI/CD"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  ansible:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::340705986117:role/GitHubRunnerAnsibleRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install Ansible + AWS Collection
        run: |
          sudo apt update
          sudo apt install -y ansible
          ansible-galaxy collection install amazon.aws

      - name: Run Ansible Playbook (EC2 via SSM)
        run: ansible-playbook -i inventory/aws_ec2.yml playbook.yml -vv